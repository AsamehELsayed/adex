version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: adex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-adex_db}
      MYSQL_USER: ${DB_USER:-adex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-adex_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - adex-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  app:
    image: ${DOCKER_IMAGE:-asamehss/adex-app:main}
    container_name: adex-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-adex_db}
      DB_USER: ${DB_USER:-adex_user}
      DB_PASSWORD: ${DB_PASSWORD:-adex_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      PORT: 3000
      APP_URL: https://adexco.net
    entrypoint: ["./node_modules/.bin/next"]
    command: ["start","-p","3000","-H","0.0.0.0"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - adex-network
      - raheed_default
    volumes:
      - ./public/uploads:/app/public/uploads

networks:
  adex-network:
    driver: bridge
  raheed_default:
    external: true

volumes:
  mysql_data:
    driver: local
